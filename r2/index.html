<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мои объявления — ЦИАН</title>
  <!-- Полный Lato с кириллицей (self-hosted в дизайн-системе) -->
  <link rel="stylesheet" href="_design-system/fonts.css?v=202608230929">
  <link rel="stylesheet" href="_design-system/tokens.css?v=202608230929">
  <link rel="stylesheet" href="_design-system/components/buttons.css?v=202608230929">
  <link rel="stylesheet" href="_design-system/components/links.css?v=202608230929">
  <link rel="stylesheet" href="_design-system/components/chips.css?v=202608230929">
  <link rel="stylesheet" href="_design-system/components/inputs.css?v=202608230929">
  <link rel="stylesheet" href="_design-system/components/tabs.css?v=202608230929">
  <link rel="stylesheet" href="_design-system/components/drawer.css?v=202608230929">
  <link rel="stylesheet" href="_design-system/components/gallery-modal.css?v=202608230929">
  <link rel="stylesheet" href="_design-system/components/checkbox.css?v=202608230929">
  <link rel="stylesheet" href="_design-system/components/badges.css?v=202608230929">
  <link rel="stylesheet" href="_design-system/components/toast.css?v=202608230929">
  <link rel="stylesheet" href="_design-system/base.css?v=202608230929">
  <link rel="stylesheet" href="_design-system/web.css?v=202608230929">
  <style>
    /* === MAIN CONTENT === */
    .main-content {
      flex: 1;
      min-width: 0;
      max-width: 1100px;
      margin: var(--unit4);                /* 16px отступ от шапки/сайдбара/края — карточка «плавает» */
      padding: 32px 32px 60px;
      background: var(--background-primary);
      border-radius: var(--radius-xxl);     /* 16px */
    }

    /* Page header */
    .page-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 24px;
    }
    .page-header h1 {
      font-size: 28px; font-weight: 700; line-height: 36px;
      letter-spacing: -0.5px;
    }
    /* Поле поиска — DS-компонент .input с левым адорнментом (лупа).
       Локально осталась только ширина. */
    .search-field { width: 380px; }

    /* Tabs (DS-компонент tabs.css). Внутренний паддинг компонента (0 24px) убираем —
       выравниваем по левому краю контента страницы; разделитель — на всю ширину. */
    .status-tabs { padding: 0; margin-bottom: 16px; }
    .status-tabs::after { left: 0; right: 0; }

    /* Category chips */
    .category-row {
      display: flex; gap: 8px; margin-bottom: 12px; align-items: center;
    }
    .category-row .separator {
      width: 1px; height: 24px; background: var(--stroke-divider-default);
      margin: 0 4px;
    }
    /* .chip — см. components/chips.css */

    /* Dropdown filters */
    .filter-row {
      display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap;
    }
    /* Фильтры-дропдауны — DS-компонент .select (components/inputs.css). */

    /* Checkbox filters — ряд DS-чекбоксов */
    .checkbox-filters {
      display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px;
    }

    /* Strategy cards */
    .strategy-row {
      display: flex; gap: 12px; margin-top: 28px; margin-bottom: 24px;
    }
    .strategy-card {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px;
      border: none;
      border-radius: var(--radius-l);
      cursor: pointer; min-width: 220px;
      background: #f3f5fa;
    }
    .strategy-card:hover { background: #e5e9f3; }
    .strategy-card .strategy-icon {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .strategy-card .strategy-label {
      font-size: 14px; font-weight: 700; line-height: 20px;
      flex: 1;
    }
    .strategy-card .strategy-arrow {
      display: flex; align-items: center; flex-shrink: 0;
    }

    /* Sort row */
    .sort-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px; padding-bottom: 12px;
    }
    .sort-label {
      font-size: 14px; line-height: 20px; color: var(--text-primary);
    }
    .sort-label a { color: var(--text-main); text-decoration: underline; cursor: pointer; }
    .sort-actions { display: flex; gap: 8px; }
    /* Select all */
    .select-all {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 0;
      font-size: 14px; color: var(--text-primary);
    }

    /* === LISTING CARDS === */
    .listing-card {
      display: flex;
      align-items: flex-start;
      padding: 16px 0;
      border-top: 1px solid var(--stroke-divider-neutral);
      gap: 0;
      position: relative;
      cursor: pointer;                     /* сниппет кликабелен — открывает шторку */
      transition: background-color 150ms ease;
    }
    .listing-card:first-child { border-top: none; }
    /* Ховер: подкрашиваем фон строки нейтральным тинтом (как строки report.html) со скруглением. */
    .listing-card:hover {
      background: var(--surface-neutral-default);
      border-radius: var(--radius-xl);
      border-top-color: transparent;
    }

    .listing-checkbox {
      width: 32px; flex-shrink: 0;
      padding-top: 4px;
    }

    /* Обёртка миниатюры: клик-триггер галереи (курсор zoom-in — аффорданс).
       На hover — лёгкое затемнение (::after) + приближение фото внутри. */
    .listing-photo-wrap {
      position: relative;
      width: 78px; height: 78px;
      flex-shrink: 0;
      margin-right: 16px;
      border-radius: var(--radius-m);
      overflow: hidden;
      cursor: zoom-in;
    }
    .listing-photo {
      width: 78px; height: 78px;
      border-radius: var(--radius-m);
      object-fit: cover;
      display: block;
      transition: transform 200ms ease;
    }
    .listing-photo-wrap:hover .listing-photo { transform: scale(1.08); }
    .listing-photo-wrap::after {
      content: '';
      position: absolute; inset: 0;
      background: rgba(13, 22, 46, 0.18);
      border-radius: inherit;
      opacity: 0;
      transition: opacity 150ms ease;
      pointer-events: none;
    }
    .listing-photo-wrap:hover::after { opacity: 1; }

    .listing-desc {
      width: 225px; flex-shrink: 0; margin-right: 16px;
    }
    .listing-desc-title {
      font-size: 14px; font-weight: 700; line-height: 20px;
      margin-bottom: 2px;
    }
    .listing-desc-metro {
      font-size: 13px; line-height: 18px; color: var(--text-primary);
      display: flex; align-items: center; gap: 4px;
      margin-bottom: 2px;
    }
    .listing-desc-address {
      font-size: 13px; line-height: 18px; color: var(--text-secondary);
    }

    /* Price column */
    .listing-price-col {
      width: 145px; flex-shrink: 0; margin-right: 20px;
      position: relative;
    }
    .listing-price {
      font-size: 16px; font-weight: 700; line-height: 24px;
    }
    .listing-price-per-m {
      font-size: 13px; line-height: 18px; color: var(--text-secondary);
      margin-bottom: 6px;
    }
    /* Stats column */
    .listing-stats {
      width: 76px; flex-shrink: 0; margin-right: 52px;
    }
    .stat-row {
      display: flex; align-items: center; gap: 4px;
      font-size: 13px; line-height: 20px;
    }
    .stat-row svg { flex-shrink: 0; }
    .stat-delta {
      color: var(--text-secondary);
      font-size: 12px;
    }

    /* Position column */
    .listing-position {
      width: 165px; flex-shrink: 0; margin-right: 20px;
    }
    .position-label {
      font-size: 13px; line-height: 18px; color: var(--text-primary);
      margin-bottom: 2px;
    }
    .position-rate {
      font-size: 13px; line-height: 18px; color: var(--text-secondary);
      margin-bottom: 4px;
    }
    .position-badges {
      display: flex; gap: 4px; align-items: center;
    }
    .badge-icon {
      display: inline-flex; align-items: center; justify-content: center;
      width: 20px; height: 20px;
    }
    /* Красный каунтер апдейтов на кнопке «N конкурентов» (угловой бейдж, Overline). */
    .comp-btn { position: relative; overflow: visible; }
    /* Счётчик апдейтов на кнопке — DS-компонент .counter.counter-s.counter-critical
       (components/badges.css). Локально осталась только привязка к углу кнопки. */
    .comp-update-badge {
      position: absolute;
      top: -6px;
      right: -6px;
    }

    /* Date column */
    .listing-date {
      width: 120px; flex-shrink: 0; margin-right: 16px;
    }
    .date-time {
      font-size: 13px; line-height: 18px; color: var(--text-primary);
    }
    .date-remaining {
      font-size: 13px; line-height: 18px; color: var(--text-secondary);
    }

    /* Boost button & send link (inside position column) */
    .card-boost { margin-top: 6px; }
    .listing-send-link {
      font-size: 13px; color: var(--text-main);
      text-decoration: none; cursor: pointer;
      display: inline-block; margin-top: 4px;
    }
    .listing-send-link:hover { text-decoration: underline; }

    /* Иконки действий — абсолютно у правого края карточки (сниппета), поверх контента.
       На узком экране flex-строка переполняется, и колонка при обычном flow уезжала за
       границу и обрезалась. Карточка (position:relative) остаётся шириной контейнера, а
       её flex-дети переполняются вправо — поэтому right:0 держит блок у ВИДИМОГО правого
       края всегда. Проявляется по ховеру (opacity). Фон = ховер-подложка карточки: при
       наложении на контент (узкий экран) иконки читаются; на широком блок попадает в пустой
       слэк справа и сливается с фоном — визуал не меняется. */
    .listing-actions {
      position: absolute;
      top: 16px;           /* = padding-top карточки: выровнять с верхом контента */
      right: 0;
      z-index: 2;
      display: flex; flex-direction: column; align-items: center;
      gap: 16px; width: 48px;
      padding-left: 12px;
      background: var(--surface-neutral-default);
      opacity: 0;
      pointer-events: none;
      transition: opacity 150ms ease;
    }
    /* Мягкий фейд слева — чтобы подложка не обрезала контент жёсткой вертикальной границей. */
    .listing-actions::before {
      content: '';
      position: absolute;
      top: 0; bottom: 0; right: 100%;
      width: 20px;
      background: linear-gradient(to right, transparent, var(--surface-neutral-default));
      pointer-events: none;
    }
    .listing-card:hover .listing-actions {
      opacity: 1;
      pointer-events: auto;
    }
    .action-icon {
      width: 24px; height: 24px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: var(--icon-secondary-default);   /* серый по умолчанию (карандаш/корзина) */
      transition: color 120ms ease;
    }
    /* Верхняя (drawer) иконка тёмная — «эхо» дефолтного клика по карточке (открыть шторку). */
    .action-icon--drawer { color: var(--icon-primary-default); }
    /* Наведённая карандаш/корзина — тёмная: сигнал, что сработает по клику. */
    .action-icon--edit:hover,
    .action-icon--archive:hover { color: var(--icon-primary-default); }
    /* Drawer-иконка гаснет, когда курсор над любым «своим» контролом карточки
       (клик по нему сделает своё действие, а не откроет шторку). Сама drawer-иконка —
       это div, не попадает в :is(a,button,input,…), поэтому на ней остаётся тёмной. */
    .listing-card:has(:is(a, button, input, .listing-photo-wrap,
        .action-icon--edit, .action-icon--archive):hover) .action-icon--drawer {
      color: var(--icon-secondary-default);
    }

    /* === ONBOARDING POPUP CARD === */
    .onboarding-tooltip {
      position: absolute;
      top: -60px;
      left: -8px;
      background: #0D162E;
      color: #fff;
      border-radius: var(--radius-l);
      padding: 16px;
      width: 160px;
      z-index: 50;
      box-shadow: 0 4px 24px rgba(0,0,0,0.16), 0 1px 4px rgba(0,0,0,0.08);
      animation: tooltipFadeIn 0.3s ease;
    }
    .onboarding-badge {
      position: absolute;
      top: -10px; right: -10px;
      display: inline-flex;
      align-items: center;
      background: var(--negative);
      color: #fff;
      font-size: 14px;
      font-weight: 400;
      line-height: 20px;
      padding: 2px 8px;
      border-radius: 99px;
    }
    .onboarding-title {
      font-size: 14px; line-height: 20px; font-weight: 700;
      margin-bottom: 8px;
    }
    .onboarding-price {
      font-size: 14px; line-height: 20px; font-weight: 700;
    }
    .onboarding-price-sub {
      font-size: 13px; line-height: 18px; color: rgba(255,255,255,0.6);
      margin-bottom: 8px;
    }

    @keyframes tooltipFadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<div id="header"></div>

<div class="layout">

  <!-- ===== MAIN CONTENT ===== -->
  <main class="main-content">

    <!-- Page Header -->
    <div class="page-header">

      <span class="input search-field"><span class="input__adornment"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M7.14648 0.646484C3.55663 0.646484 0.646484 3.55663 0.646484 7.14648C0.646484 10.7363 3.55663 13.6465 7.14648 13.6465C8.58059 13.6465 9.90622 13.1821 10.9812 12.3954L13.9394 15.3536L15.3536 13.9394L12.3954 10.9812C13.1821 9.90622 13.6465 8.58059 13.6465 7.14648C13.6465 3.55663 10.7363 0.646484 7.14648 0.646484ZM2.64648 7.14648C2.64648 4.6612 4.6612 2.64648 7.14648 2.64648C9.63177 2.64648 11.6465 4.6612 11.6465 7.14648C11.6465 9.63177 9.63177 11.6465 7.14648 11.6465C4.6612 11.6465 2.64648 9.63177 2.64648 7.14648Z" fill="currentColor"/></svg></span><input class="input__control" type="text" placeholder="Поиск объявлений по ID, адресу, метро, описанию и т.д."></span>

    <!-- Strategy Cards -->

    <!-- Sort Row -->
    <div class="sort-row">

renderHeader('_design-system/');
renderSidebar({ active: 'Мои объявления' });

const LISTINGS = [

// Плюрализация RU: (n, ['обновление','обновления','обновлений']).
function plural(n, forms) {
  const mod10 = n % 10, mod100 = n % 100;
  if (mod100 >= 11 && mod100 <= 14) return forms[2];
  if (mod10 === 1) return forms[0];
  if (mod10 >= 2 && mod10 <= 4) return forms[1];
  return forms[2];
}
// Раскладка каунтера апдейтов = как в отчёте: до 2 «обновлений» по отслеживаемым
// (цена + снятие), остаток — «новые конкуренты». Возвращает title для нативного тултипа.
function updatesTooltip(updates) {
  const changed = Math.min(2, updates);
  const fresh = updates - changed;
  const lines = [];
  if (changed > 0) lines.push(changed + ' ' + plural(changed, ['обновление', 'обновления', 'обновлений']));
  if (fresh > 0) lines.push(fresh + ' ' + plural(fresh, ['новый конкурент', 'новых конкурента', 'новых конкурентов']));
  return lines.join('\n');
}

  //   «Конкуренты» — отчёт ещё не активирован (1–2); «N конкурентов (X)» — сгенерирован + апдейты (1–2);
  //   остальные — сгенерирован без апдейтов.
  const idxPool = LISTINGS.map((_, i) => i);
  for (let k = idxPool.length - 1; k > 0; k--) {
    const j = Math.floor(Math.random() * (k + 1));
    [idxPool[k], idxPool[j]] = [idxPool[j], idxPool[k]];
  }
  const nNotActivated = 1 + Math.floor(Math.random() * 2); // 1 или 2
  const nWithUpdates  = 1 + Math.floor(Math.random() * 2); // 1 или 2
  const notActivated = new Set(idxPool.slice(0, nNotActivated));
  const withUpdates  = new Set(idxPool.slice(nNotActivated, nNotActivated + nWithUpdates));

(function selectAllListings() {
  var all = document.getElementById('selectAllListings');

  function items() {
    return Array.prototype.slice.call(listings.querySelectorAll('[data-listing-check]'));
  }
  function syncHeader() {
    var list = items();
    var n = list.filter(function (i) { return i.checked; }).length;
    all.checked = list.length > 0 && n === list.length;
    all.indeterminate = n > 0 && n < list.length;
  }

  all.addEventListener('change', function () {
    // Клик по промежуточному состоянию выбирает всё — как в проде и в вебе вообще.
    items().forEach(function (i) { i.checked = all.checked; });
    all.indeterminate = false;
  });
  listings.addEventListener('change', function (e) {
    if (e.target.matches('[data-listing-check]')) syncHeader();
  });
  syncHeader();
})();

// Клик по карточке: по миниатюре фото → фото-галерея (DS-компонент openGallery);
// по остальной части карточки → шторка (openDrawer). Клики по интерактивным контролам
// (чекбокс, ссылки, кнопки, иконки действий) не перехватываем — работают как прежде.
(function listingClicks() {
  var listings = document.getElementById('listings');
  if (!listings) return;
  listings.addEventListener('click', function (e) {
    // 1) Клик по фото → галерея фотографий этого объекта.
    var photo = e.target.closest('[data-action="open-gallery"]');
    if (photo) {
      if (typeof openGallery !== 'function') return;
      var item = LISTINGS[+photo.getAttribute('data-idx')];
      if (item && item.photos && item.photos.length) {
        openGallery({
          photos: item.photos,
          title: item.desc + ', ' + item.price + ' ₽',
          coverIndex: 0,
          ariaLabel: 'Фотографии объявления'
        });
      }
      return;
    }
    // 2) Иконки действий справа. Прогресс-снекбары без галки (галка = успех, не подходит).
    if (e.target.closest('[data-action="edit-listing"]')) {
      if (typeof showToast === 'function') showToast('Открываем форму редактирования');
      return;
    }
    if (e.target.closest('[data-action="archive-listing"]')) {
      if (typeof showToast === 'function') showToast('Отправляем в архив');
      return;
    }
    // Верхняя иконка — явный триггер шторки (то же дефолтное действие карточки).
    if (e.target.closest('[data-action="open-listing-drawer"]')) {
      if (typeof openDrawer === 'function') openDrawer({ ariaLabel: 'Объявление' });
      return;
    }
    // 3) Клик по остальной части карточки → шторка.
    if (typeof openDrawer !== 'function') return;
    var card = e.target.closest('.listing-card');
    if (!card) return;
    if (e.target.closest('a, button, input, label, .action-icon, [data-action]')) return;
    openDrawer({ ariaLabel: 'Объявление' });
  });
})();

// Статус-табы (DS-компонент) — визуальное переключение активного (контент в прототипе один)
(function statusTabs() {
  var bar = document.querySelector('.status-tabs');
  if (!bar) return;
  bar.addEventListener('click', function(e) {
    var tab = e.target.closest ? e.target.closest('.tab') : null;
    if (!tab) return;
    bar.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
    tab.classList.add('active');
  });
})();

// === SNACKBAR: "Отчёт сохранён" after returning from report ===
// Использует DS-компонент showToast (toast.js). Успех → с галкой, прогресс → без.
(function() {
  var params = new URLSearchParams(window.location.search);
  if (params.get('saved') !== '1') return;
  history.replaceState(null, '', window.location.pathname);   // подчистить URL
  if (typeof showToast === 'function') showToast.success('Отчёт сохранён');
})();
</script>
</body>
</html>
