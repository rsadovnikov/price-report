<!DOCTYPE html>
<html lang="ru" data-surface="app">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Сафари на айфоне сама превращает длинные группы цифр в телефонные ссылки:
       цены «23 700 000 ₽» и границы оценки становились синими и подчёркнутыми,
       то есть выглядели кликабельными и вели в звонилку. Это детектор данных iOS,
       а не наша разметка — в ней это обычный <p>. Выключается только этим мета-тегом.
       Замечено Романом 2026-08-23 на живом проде. -->
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
  <!-- Без *-web-app-capable медиазапрос (display-mode: standalone) на айфоне не срабатывает,
       и мок статус-бара остаётся поверх настоящего. То есть это не украшение, а условие,
       при котором уже написанный CSS вообще включается. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="../_design-system/assets/app-icon-180.png">
  <title>Конкуренты объекта — приложение</title>

  <link rel="stylesheet" href="../_design-system/tokens.css?v=202608312031">
  <link rel="stylesheet" href="../_design-system/tokens/surface-app.css?v=202608312031">
  <link rel="stylesheet" href="../_design-system/base.css?v=202608312031">
  <link rel="stylesheet" href="../_design-system/components/app/screen.css?v=202608312031">
  <link rel="stylesheet" href="../_design-system/components/app/navbar.css?v=202608312031">
  <link rel="stylesheet" href="../_design-system/components/app/cells.css?v=202608312031">
  <link rel="stylesheet" href="../_design-system/components/app/tabs.css?v=202608312031">
  <link rel="stylesheet" href="../_design-system/components/app/badge.css?v=202608312031">
  <link rel="stylesheet" href="../_design-system/components/app/buttons.css?v=202608312031">
  <link rel="stylesheet" href="../_design-system/components/app/chips.css?v=202608312031">
  <link rel="stylesheet" href="../_design-system/components/app/competitor-card.css?v=202608312031">
  <link rel="stylesheet" href="../_design-system/components/app/price-history.css?v=202608312031">
  <link rel="stylesheet" href="../_design-system/components/app/bottom-bar.css?v=202608312031">
  <link rel="stylesheet" href="../_design-system/components/app/snackbar.css?v=202608312031">
  <!-- Фильтры выбираются в шторке: она сама, поля «от / до», слайдер радиуса
       и панель с «Применить» -->
  <link rel="stylesheet" href="../_design-system/components/app/sheet.css?v=202608312031">
  <link rel="stylesheet" href="../_design-system/components/app/inputs.css?v=202608312031">
  <link rel="stylesheet" href="../_design-system/components/app/slider.css?v=202608312031">
  <link rel="stylesheet" href="../_design-system/components/app/screen-footer.css?v=202608312031">
  <link rel="stylesheet" href="../_design-system/components/app/list-tail.css?v=202608312031">
  <link rel="stylesheet" href="../_design-system/components/app/page-transition.css?v=202608312031">
  <!-- Направление перехода (вперёд/назад) — в <head> и без defer: `pagereveal`
       приходит раньше конца парсинга, позже вешать слушатель уже поздно. -->
  <script src="../_design-system/components/app/page-transition.js?v=202608312031"></script>

  <style>
    body {
      background: var(--background-secondary);
      -webkit-font-smoothing: antialiased;
    }
    /* `[hidden] { display: none !important }` переехал в base.css — он нужен всем
       страницам, а стоял только здесь. Из-за этого на экране настройки сводка цен
       и полоса цены не прятались. */
    /* Раскладка и диапазон ширин — в components/app/screen.css */
    /* Ряд табов на этом экране несёт собственные отступы: заголовок над ним
       уже отбит своим паддингом. Снизу 4 — это зазор до ряда фильтров, а не низ
       шапки. */
    .tabs-row { padding: var(--unit3) 0 var(--unit1); }
    /* Низ шапки — 12, и несёт его ПОСЛЕДНИЙ ВИДИМЫЙ блок. На «Подборке» и
       «Архивных» это ряд фильтров со своими 12; на «Отслеживаются» фильтров нет,
       и низ остаётся за табами — а там стояли 4 зазора, и пилюля почти упиралась
       в срез карточки (нашёл Роман 2026-08-24). Правило было записано для случая
       «под табами идут фильтры», и случай без них никто не проверил.
       Условие — «видимого ряда фильтров нет», а не «ряд спрятан»: уберут блок из
       разметки совсем — правило переживёт, а не отвалится молча. */
    .appbar:not(:has(> .chips-scroll-app:not([hidden]))) .tabs-row {
      padding-bottom: var(--unit3);
    }
    .competitors-list {
      display: flex;
      flex-direction: column;
      gap: var(--unit2);
      /* Лента забирает остаток высоты экрана — это нужно пустой выдаче: её блок
         в макете (894:146771) занимает всё место до подвала. Карточкам это ничего
         не меняет, они по содержимому. */
      flex: 1;
    }
    /* Место под нижнюю плашку — только там, где она есть (вкладка «Отслеживаются»):
       75 плашка + отступы. */
    .competitors-list--with-bottom-bar {
      padding-bottom: calc(99px + env(safe-area-inset-bottom));
    }

    /* --- Наполнение шторки фильтра ---
       Раскладка экрана, а не компонента: шторка не знает, что в неё положили. */
    .filter-sheet__chips {
      display: flex;
      flex-wrap: wrap;
      gap: var(--unit2);
      padding: var(--unit1) 0 var(--unit2);
    }
    /* Поля «от / до»: в макете 163,5 каждое при зазоре 8 — то есть просто половина
       ширины. Держим долями, а не числом: 163,5 верно только на 375. */
    .filter-sheet__row {
      display: flex;
      gap: var(--unit2);
      padding: var(--unit1) 0 var(--unit2);
    }
    .filter-sheet__input { flex: 1; min-width: 0; }
    .filter-sheet__slider { padding: var(--unit2) 0 var(--unit4); }
  </style>
</head>
<body>

<div class="screen-app">

  <!-- Шапка остаётся на экране целиком (решение Романа 2026-08-23): и стрелка с
       заголовком, и табы, и ряд фильтров стоят в кадре при прокрутке. Механика —
       одна строка `position: sticky` в navbar.css, `.appbar--sticky`. -->
  <header class="appbar appbar--flush appbar--sticky card-app--head">
    <div class="statusbar-app" aria-hidden="true">
      <img class="statusbar-app__time" src="../_design-system/assets/icons/statusbar-time.svg" alt="">
      <div class="statusbar-app__island"></div>
      <img class="statusbar-app__indicators" src="../_design-system/assets/icons/statusbar-indicators.svg" alt="">
    </div>

    <nav class="navbar-app">
      <a class="navbar-app__icon navbar-app__icon--back" id="back" href="report-app.html" aria-label="Назад">
        <img src="../_design-system/assets/icons/arrow-back-24.svg" alt="">
      </a>
      <p class="navbar-app__title"></p>
    </nav>

    <div class="cell-app-title">
      <h1 class="cell-app-title__text">Конкуренты объекта</h1>
    </div>

    <div class="tabs-row">
      <div class="tabs-app" role="tablist">
        <button class="tab-app tab-app--active" type="button" role="tab" aria-selected="true" data-tab="tracked">
          Отслеживаются <span class="tab-app__count" id="tracked-count">0</span>
        </button>
        <button class="tab-app" type="button" role="tab" aria-selected="false" data-tab="selection">Подборка</button>
        <button class="tab-app" type="button" role="tab" aria-selected="false" data-tab="archive">Архивные</button>
      </div>
    </div>

    <!-- Фильтры одним рядом с горизонтальным скроллом (решение Романа 2026-08-23;
         в макете было два ряда с общим скроллом). Виден только на «Подборке» и
         «Архивных» — как в вебовом отчёте, где это тоже один общий ряд на две
         вкладки. -->
    <div class="chips-scroll-app" id="filters" hidden>
      <div class="chips-scroll-app__row" id="filters-row"></div>
    </div>
  </header>

  <main class="competitors-list competitors-list--with-bottom-bar" id="competitors"></main>

  <!-- Хвосты ленты. Лежат шаблонами, а не готовыми узлами: список перерисовывается
       целиком, и всё, что должно стоять ПОСЛЕ карточек, обязано попадать в тот же
       innerHTML — иначе оно либо затрётся, либо выпадет из ритма ленты (зазор 8). -->

  <!-- Фильтры отсеяли всё. Макет 894:146771 (прислан Романом 2026-08-23): только
       иллюстрация, заголовок и текст — кнопки внутри блока нет, а под ним идёт
       обычный подвал ленты с «Добавить по ссылке». До этого здесь стояла кнопка
       «Сбросить фильтры»: своего макета у состояния не было, и блок собирался по
       образцу конца подборки (563:69202).
       ⚠️ Текст советует сбросить фильтры, а контрола для этого на экране нет —
       вынесено Роману отдельным вопросом. -->
  <template id="tpl-empty">
    <div class="list-tail-app list-tail-app--empty" id="filters-empty">
      <img class="list-tail-app__art" src="../_design-system/assets/empty-search-100.png" alt="">
      <div class="list-tail-app__head">
        <p class="list-tail-app__title">Не нашли таких объявлений</p>
        <p class="list-tail-app__note">
          Попробуйте сбросить или изменить фильтры. Ищете конкретное объявление?
          Добавьте его по ссылке.
        </p>
      </div>
    </div>
  </template>

  <!-- Список показывается по 10 — макет 563:74168. Пока есть непоказанные, лента
       кончается этой кнопкой, а не блоком «Это всё, что нашлось». -->
  <template id="tpl-more">
    <div class="list-tail-app list-tail-app--more" id="show-more">
      <button class="btn-app btn-app--medium btn-app--secondary btn-app--main btn-app--block"
              type="button" data-action="show-more">Показать ещё</button>
    </div>
  </template>

  <!-- Долистал до конца — макет 563:69202. Вторая группа адресована подборке:
       на самом архиве «Добавить из архива» бессмысленно, и там она снимается. -->
  <template id="tpl-end">
    <div class="list-tail-app" id="selection-end">
      <div class="list-tail-app__head">
        <img class="list-tail-app__art" src="../_design-system/assets/empty-search-100.png" alt="">
        <p class="list-tail-app__title">Это всё, что нашлось</p>
      </div>
      <div class="list-tail-app__groups">
        <div class="list-tail-app__group">
          <p class="list-tail-app__note">
            Если нужно больше объявлений — попробуйте сделать фильтры менее строгими
          </p>
          <button class="btn-app btn-app--medium btn-app--secondary btn-app--main btn-app--block"
                  type="button" data-action="edit-filters">Изменить фильтры</button>
        </div>
        <div class="list-tail-app__group" data-group="archive">
          <p class="list-tail-app__note">
            Объекты, которые недавно продались, попадают в архив, но всё ещё могут быть
            полезными в отчёте для клиента
          </p>
          <button class="btn-app btn-app--medium btn-app--secondary btn-app--main btn-app--block"
                  type="button" data-action="from-archive">Добавить из архива</button>
        </div>
      </div>
    </div>
  </template>

  <!-- Подвал ленты — макет 698:76453. Идёт последним и под «Показать ещё», и под
       «Это всё, что нашлось»: вопрос про конкретный объект уместен в обоих случаях. -->
  <template id="tpl-footer">
    <div class="list-tail-app list-tail-app--footer" id="selection-link">
      <p class="list-tail-app__note">Хотите отслеживать какой-то конкретный объект на Циане?</p>
      <button class="btn-app btn-app--medium btn-app--secondary btn-app--main btn-app--block"
              type="button" data-action="add-by-link">Добавить по ссылке</button>
    </div>
  </template>
</div>

<div class="bottom-bar-app" id="bottom-bar" role="status">
  <p class="bottom-bar-app__text">Создайте отчёт для собственника на основе этих данных</p>
  <a class="btn-app btn-app--medium btn-app--primary btn-app--main" id="create-report" href="owner-report-app.html">Создать</a>
</div>

<script src="../_design-system/components/app/snackbar.js?v=202608312031"></script>
<script src="../_design-system/components/app/sheet.js?v=202608312031"></script>
<script src="../_design-system/components/app/slider.js?v=202608312031"></script>
<!-- Общая база мок-данных: объявления в модели ЦИАНа. Сценарий (чьи объекты,
     что показано снятым) — в mock-scenario.js, форма записи для отчёта — в mock-connect.js. -->
<script src="../_mock-data/mock.js?v=202608312031"></script>
<script src="../_mock-data/datasets/cian-secondary/listings.js?v=202608312031"></script>
<script src="mock-scenario.js?v=202608312031"></script>
<script src="mock-connect.js?v=202608312031"></script>
<script src="competitor-card-app.js?v=202608312031"></script>
<!-- Предустановка фильтров по объекту — общая на весь раздел -->
<script src="preset-app.js?v=202608312031"></script>
<!-- Раскладка апдейтов — общая с экраном обзора -->
<script src="updates-app.js?v=202608312031"></script>
<script src="competitors-app.js?v=202608312031"></script>
<!-- ⌘⇧R — сброс демо-состояния и возврат к первому входу -->
<script src="dev-reset.js?v=202608312031"></script>
</body>
</html>
