<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Обзор конкурентов — версия с нижней полкой</title>
  <!-- Вариант отчёта, у которого низ собран в ОДНУ прилепленную полку: и переход в
       следующий список, и новости о конкурентах, и вход в отчёт для собственника.
       Разметка у него общая с report.html — полку включает флаг `shelf=1`, а эта
       страница существует ради адреса: ссылку на вариант надо давать и запоминать,
       а не диктовать параметр. Остальные параметры отчёта (n, u, desc…) переезжают.
       С 2026-09-10 заход сюда ещё и ЗАПОМИНАЕТ версию (guard в шапке report.html
       пишет флаг в localStorage), поэтому дальше по прототипу — index.html, переходы
       внутрь — отчёт открывается тот же. Вернуть обычный: `report.html?shelf=0`
       или ⌘⇧S на самом отчёте.
       ⚠️ С 2026-09-14 полка — версия по умолчанию, и `report.html` без параметра
       открывает её сам. Эта страница нужна теперь только тому, у кого запомнена
       обычная: заход сюда её перезапишет. -->
  <script>
    var q = new URLSearchParams(location.search);
    q.set('shelf', '1');
    location.replace('report.html?' + q.toString());
  </script>
</head>
<body></body>
</html>
